<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud Vote — {{ option_a }} vs {{ option_b }}</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .card { background: #1e293b; padding: 40px; border-radius: 16px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.4); width: 360px; }
    h1 { margin: 0 0 24px; font-size: 22px; }
    form { display: flex; gap: 12px; }
    button { flex: 1; padding: 20px; font-size: 18px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; color: #fff; transition: transform .05s; }
    button:active { transform: scale(.97); }
    button.a { background: #4285F4; }
    button.b { background: #FF9900; }
    .voted { margin-top: 20px; font-size: 15px; }
    .host { margin-top: 24px; font-size: 12px; color: #64748b; }
    .error { margin-top: 16px; font-size: 14px; color: #f87171; background: rgba(239,68,68,.15); border-radius: 8px; padding: 10px 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Which cloud do you prefer?</h1>
    <form method="POST">
      <button name="vote" value="{{ option_a }}" class="a">{{ option_a }}</button>
      <button name="vote" value="{{ option_b }}" class="b">{{ option_b }}</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    {% if vote %}<p class="voted">You voted <strong>{{ vote }}</strong>. See the live tally on the results page.</p>{% endif %}
    <p class="host">Served by pod {{ hostname }}</p>
  </div>
</body>
</html>
