# Web Application A - Vote frontend (GCP vs AWS). Writes votes to Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-a
  labels:
    app: webapp-a
    role: vote
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-a
  template:
    metadata:
      labels:
        app: webapp-a
        role: vote
    spec:
      serviceAccountName: webapp-ksa
      terminationGracePeriodSeconds: 30
      containers:
      - name: vote
        # Built + pushed by cloudbuild.yaml to Artifact Registry.
        image: REGION-docker.pkg.dev/PROJECT_ID/webapps/vote:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: webapp-config
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - mountPath: "/mnt/secrets-store"
          name: secrets-store-inline
          readOnly: true
      volumes:
      # Secret Manager via the GKE Secrets Store CSI driver (Workload Identity).
      - name: secrets-store-inline
        csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "gcp-secrets-provider"
