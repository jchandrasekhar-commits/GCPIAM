apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-b
  labels:
    app: webapp-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-b
  template:
    metadata:
      labels:
        app: webapp-b
    spec:
      serviceAccountName: webapp-ksa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: webapp-b
        image: gcr.io/google-samples/hello-app:1.0
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        resources:
          requests:
            cpu: "25m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
      - name: webapp-proxy
        image: nginx:1.27-alpine
        ports:
        - containerPort: 8080
        command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config
        configMap:
          name: webapp-nginx-config
