# Web Application B - Results frontend. Reads the vote tally from Cloud SQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-b
  labels:
    app: webapp-b
    role: result
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-b
  template:
    metadata:
      labels:
        app: webapp-b
        role: result
    spec:
      serviceAccountName: webapp-ksa
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: result
        # Built + pushed by cloudbuild.yaml to Artifact Registry.
        image: us-central1-docker.pkg.dev/project-pubsub-32009/webapps/result:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: webapp-config
        - secretRef:
            name: webapp-db-secret
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - mountPath: "/tmp"
          name: tmp-dir
      volumes:
      - name: tmp-dir
        emptyDir: {}
