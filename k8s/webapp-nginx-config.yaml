apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-nginx-config
  namespace: default
data:
  nginx.conf: |
    worker_processes 1;
    events {
      worker_connections 1024;
    }
    http {
      log_format timed '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent request_time=$request_time upstream_response_time=$upstream_response_time';
      access_log /dev/stdout timed;
      error_log /dev/stderr warn;
      server {
        listen 8080;
        location / {
          proxy_pass http://127.0.0.1:8081;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }