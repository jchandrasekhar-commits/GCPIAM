apiVersion: v1
kind: Service
metadata:
  name: webapp-a
  annotations:
    # Container-native load balancing: route the global LB straight to pods
    # via a Network Endpoint Group (NEG) instead of through kube-proxy.
    cloud.google.com/neg: '{"ingress": true}'
    # Attach the BackendConfig (Cloud Armor WAF + health check).
    cloud.google.com/backend-config: '{"default": "webapps-backendconfig"}'
spec:
  selector:
    app: webapp-a
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  # GKE Ingress backends must be NodePort (or ClusterIP w/ NEG). NodePort here.
  type: NodePort
