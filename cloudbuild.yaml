substitutions:
  _REGION: us-central1
  _REPO: webapps
  # _TAG is set to $SHORT_SHA by the Cloud Build trigger (see cloudbuild-trigger.yaml),
  # giving every image a unique, traceable 7-char commit SHA tag.
  # For a manual build: --substitutions=_TAG=$(git rev-parse --short HEAD)
  _TAG: latest

steps:
# --- Build AND push each image immediately ----------------------------------
# Push right after each build so images land in Artifact Registry even if a
# later step (deploy) fails. Plain arg arrays use only Cloud Build
# substitutions (no shell vars, which would need $$ escaping).
- name: 'gcr.io/cloud-builders/docker'
  id: build-vote
  args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vote:${_TAG}', 'apps/vote']
- name: 'gcr.io/cloud-builders/docker'
  id: push-vote
  args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vote:${_TAG}']
- name: 'gcr.io/cloud-builders/docker'
  id: build-worker
  args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/worker:${_TAG}', 'apps/worker']
- name: 'gcr.io/cloud-builders/docker'
  id: push-worker
  args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/worker:${_TAG}']
- name: 'gcr.io/cloud-builders/docker'
  id: build-result
  args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/result:${_TAG}', 'apps/result']
- name: 'gcr.io/cloud-builders/docker'
  id: push-result
  args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/result:${_TAG}']

# --- Terraform plan: detect infrastructure drift before deploying -----------
# Fails the build on Terraform errors (exit 1). Intentional pending changes
# visible in the log do NOT block the app deployment — apply them separately
# after review: terraform apply -var-file=terraform.tfvars
- name: 'hashicorp/terraform:1.9'
  id: tf-plan
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    cd terraform
    terraform init \
      -backend-config="bucket=$PROJECT_ID-tfstate" \
      -backend-config="prefix=gcpiam/state" \
      -input=false -reconfigure
    terraform plan \
      -var="project_id=$PROJECT_ID" \
      -var="region=${_REGION}" \
      -input=false \
      -compact-warnings
  env:
  - 'TF_IN_AUTOMATION=1'

# --- Deploy: substitute image placeholders, then apply ----------------------
- name: 'gcr.io/cloud-builders/kubectl'
  id: deploy
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    # entrypoint: bash bypasses the kubectl builder's auto get-credentials
    # wrapper, so fetch cluster credentials explicitly first. Shell variables
    # are escaped as $$ so Cloud Build does not treat them as substitutions.
    gcloud container clusters get-credentials gke-primary --region ${_REGION} --project $PROJECT_ID
    for f in k8s/webapp-a-deployment.yaml k8s/webapp-b-deployment.yaml k8s/worker-deployment.yaml; do
      sed -i "s|REGION-docker.pkg.dev/PROJECT_ID|${_REGION}-docker.pkg.dev/$PROJECT_ID|g; s|:latest|:${_TAG}|g" "$$f"
    done
    # Do not re-apply placeholder config/secret values from webapp-config.yaml.
    # This file contains template defaults (REDIS_HOST_IP / DB_PRIVATE_IP / placeholder
    # DB password) that can overwrite live runtime settings after Terraform output patching.
    kubectl apply -f k8s/webapp-a-deployment.yaml -f k8s/webapp-a-service.yaml -f k8s/webapp-a-hpa.yaml
    kubectl apply -f k8s/webapp-b-deployment.yaml -f k8s/webapp-b-service.yaml -f k8s/webapp-b-hpa.yaml
    kubectl apply -f k8s/worker-deployment.yaml
    # With a unique SHA tag, kubectl apply detects the image change and triggers
    # a rolling update automatically. Force a restart only for the :latest fallback
    # (where the image digest is unchanged so apply alone won't cycle pods).
    if [ "${_TAG}" = "latest" ] || [ -z "${_TAG}" ]; then
      kubectl rollout restart deployment/webapp-a deployment/webapp-b deployment/worker
    fi
  env:
  - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
  - 'CLOUDSDK_CONTAINER_CLUSTER=gke-primary'

options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
